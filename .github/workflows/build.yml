name: Build PCL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, one decimal place (e.g. 1.0). Defaults to 1.0 for the initial PCL release.'
        required: false
        default: '1.0'

permissions:
  contents: write

# Serialize releases so two quick pushes cannot choose the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: PCL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          # PCL starts a fresh v1.x release line; ignore legacy CallCompanion v5.x tags.
          last=$(git tag -l 'v1.*' | grep -E '^v1\.[0-9]$' | sort -V | tail -1 || true)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}
            n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Release v$ver already exists; choose the next version."
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "Version: $ver (previous: ${last:-none})"

          # Build notes from commits since the previous PCL release.
          # The version-line scoped tag lookup above ignores legacy CallCompanion v5.x tags.
          prev="$last"
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' "$range" | head -40)
          [ -n "$changes" ] || changes="- Maintenance and build updates"

          {
            echo "## $APP $ver"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the APK below and install it on both phones."
            echo
            echo "_Built from ${GITHUB_SHA::7} ${prev:+· changes since $prev}_"
          } > release-notes.md
          cat release-notes.md

      - name: Build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug -PappVersion="$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "$APP-$VERSION.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP }} ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APP }}-${{ env.VERSION }}.apk
          make_latest: true
