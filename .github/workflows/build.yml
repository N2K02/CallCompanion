name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface compiler / Gradle errors as annotations so they are visible without logs.
            grep -E -A4 "^e: |What went wrong|requires|Could not|error:" build.log | grep -v "^--$" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk VGS.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VGS-apk
          path: VGS.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VGS build ${{ github.run_number }}
          body: Download VGS.apk below and install it on both phones.
          files: VGS.apk
          make_latest: true
