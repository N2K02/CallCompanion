name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VGS.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VGS-apk
          path: VGS.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VGS build ${{ github.run_number }}
          body: Download VGS.apk below and install it on both phones.
          files: VGS.apk
          make_latest: true
