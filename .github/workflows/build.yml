name: Build PCL APK

on:
  push:
    branches: [ main ]
    # Documentation-only pushes don't change the APK, so they don't publish a release.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, one decimal place (e.g. 2.1). Leave empty for the next version after the latest tag.'
        required: false
        default: ''

permissions:
  contents: write

# Serialize releases so two quick pushes cannot choose the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: PCL

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest release tag of the form vMAJOR.MINOR (v1.9, v2.0, ...).
          # Preserve the highest installed release lineage from source or public distribution.
          local_last=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+[.][0-9]$' | sort -V | tail -1 || true)
          public_last=$(gh api 'repos/N2K02/n2k02.github.io/releases?per_page=100' --jq '.[].tag_name' 2>/dev/null | sed -nE 's/^pcl-v([0-9]+[.][0-9])(-build-[0-9]+)?$/v\1/p' | sort -V | tail -1 || true)
          last=$(printf '%s\n%s\n' "$local_last" "$public_last" | sort -V | tail -1)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}
            n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Release v$ver already exists; choose the next version."
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 100000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "VERSION_SUFFIX=-experimental.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          fi
          echo "Version: $ver (previous: ${last:-none})"

          # Build notes from commits since the previous release.
          prev=""
          if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null; then prev="$last"; fi
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          changes=$(git log --no-merges --pretty='- %s' "$range" | head -40)
          [ -n "$changes" ] || changes="- Maintenance and build updates"

          {
            echo "## $APP $ver"
            echo
            echo "### What's new"
            echo "$changes"
            echo
            echo "### Install"
            echo "Download the APK below and install it on both phones."
            echo
            echo "_Built from ${GITHUB_SHA::7} ${prev:+· changes since $prev}_"
          } > release-notes.md
          cat release-notes.md

      - name: Build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          cp app/build/outputs/apk/debug/app-debug.apk "$APP-$VERSION.apk"

      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP }} ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APP }}-${{ env.VERSION }}.apk
          make_latest: true

      - name: Publish signed experimental APK to source PR release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "$APP-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$PR_HEAD_SHA" \
            --title "$APP experimental · PR #$PR_NUMBER · build $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md --prerelease --latest=false

      - name: Check public distribution configuration
        id: distribution
        env:
          DIST_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
        run: |
          if [ -n "$DIST_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DISTRIBUTION_TOKEN is unavailable to this repository's workflow. Signed APK artifacts remain available, but public stable/experimental manifests cannot be published."
          fi

      - name: Publish stable or experimental APK to public distribution
        if: steps.distribution.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
