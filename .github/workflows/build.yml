name: Build PCL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, one decimal place (e.g. 1.0). Defaults to 1.0 for the initial PCL release.'
        required: false
        default: '1.0'

permissions:
  contents: write

# Serialize releases so two quick pushes cannot choose the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: PCL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Work out version and release notes
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          # PCL starts a fresh v1.x release line; ignore legacy CallCompanion v5.x tags.
          last=$(git tag -l 'v1.*' | grep -E '^v1\.[0-9]$' | sort -V | tail -1 || true)
          if [ -n "$REQUESTED" ]; then
            echo "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]$' || { echo "::error::Version must look like 1.0"; exit 1; }
            ver="$REQUESTED"
          elif [ -z "$last" ]; then
            ver="1.0"
          else
            t=${last#v}
            n=$(( ${t%.*} * 10 + ${t#*.} + 1 ))
            ver="$(( n / 10 )).$(( n % 10 ))"
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::Release v$ver already exists; choose the next version."
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "Version: $ver (previous: ${last:-none})"

          {
            echo "## $APP $ver"
            echo
            echo "### What's new"
            cat <<'CHANGELOG'
          - Document native WhatsApp notification priority
          - Remove mirrored WhatsApp calls when Remote is already ringing
          - Suppress duplicate WhatsApp call notifications on Remote
          - Document account identity limit for WhatsApp call guard
          - Reset per-package peer call states on disconnect
          - Expose source package for guarded notification actions
          - Guard duplicate WhatsApp answers per app package
          - Track WhatsApp call state separately by app package
          - Remove duplicate WhatsApp package helper
          - Clarify notification listener runs on both phones
          - Allow Remote to answer mirrored WhatsApp call notifications
          - Keep call-notification protocol backward compatible
          - Document WhatsApp call-state safety and Remote answering
          - Guard stale WhatsApp answer actions on either phone
          - Require notification access on both phones for call-state detection
          - Include source package for safe mirrored call actions
          - Relay WhatsApp call state and guard duplicate answers
          - Detect WhatsApp call state on both phones
          - Detect WhatsApp call actions before excluding mirroring
          - Document native WhatsApp linked-device call handling
          - Keep WhatsApp call answering local to linked devices
          - Clean up duplicate flow and retain internet sharing docs
          - Explain Gateway and Remote roles with a flow diagram
          - Document Bluetooth tethering limitations and setup
          - Add Bluetooth internet sharing setup guidance
          CHANGELOG
            echo
            echo "### Install"
            echo "Download the APK below and install it on both phones."
          } > release-notes.md
          cat release-notes.md

      - name: Build APK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug -PappVersion="$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "$APP-$VERSION.apk"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP }} ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.APP }}-${{ env.VERSION }}.apk
          make_latest: true
